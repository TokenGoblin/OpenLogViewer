# The work packages of the port, in the form `cargo xtask` reads.
#
# Every C# source file in src/ belongs to exactly one package, and `cargo xtask check`
# fails if one is missing, listed twice, or depends on code a later wave ports. Names
# without a slash are looked up in src/OpenLogViewer.Core and src/OpenLogViewer.App
# (".cs" and ".xaml.cs" both tried); names with one are repo-relative.
#
# model:  opus | sonnet | haiku     effort: lower | default | higher
# review: an Opus review of the diff is part of the gate (see PLAN.md, rule 8)
# kind:   port (default) | spec (produces a document, not code)

# ----- Wave 0: foundation (two packages in parallel)

[[package]]
id = "w0-model"
wave = 0
crate = "olv-core"
module = "model"
model = "opus"
effort = "higher"
files = ["UnitConvert", "SafeXml", "TuningText", "TraceScale", "LogChannel", "LogDocument", "ILogReader", "TuneAxes", "RealtimeCommand", "CanFrame", "WireTrace", "ILiveSource", "IRawTelemetrySource"]

[[package]]
id = "w0-base"
wave = 0
crate = "olv-core"
module = "base"
model = "sonnet"
files = ["TuningMath", "MathExpression", "Smoothing", "JsonSettingsFile", "SafeFolder"]

