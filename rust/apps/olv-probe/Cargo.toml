[package]
name = "olv-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "olv-probe"
path = "src/main.rs"

[dependencies]
olv-core = { path = "../../crates/olv-core" }
olv-live = { path = "../../crates/olv-live" }
olv-protocol = { path = "../../crates/olv-protocol" }
olv-transport = { path = "../../crates/olv-transport" }
time = { workspace = true, features = ["local-offset"] }

[lints]
workspace = true
