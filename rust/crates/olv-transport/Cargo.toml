[package]
name = "olv-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
olv-core = { path = "../olv-core" }
olv-protocol = { path = "../olv-protocol" }
nusb.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
time.workspace = true

# Bluetooth LE. btleplug's Linux backend links libdbus (banned in deny.toml), so it is
# used only where its backend is the OS's own API: WinRT on Windows, CoreBluetooth on macOS.
# On Linux BlueZ is spoken to directly over D-Bus with the pure-Rust zbus.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
btleplug.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# Our own serial-port layer (`transport/serial_port.rs`) replaces the `serialport` crate, which is
# MPL-2.0. Windows: Win32 comm and SetupAPI through windows-sys. Linux and macOS: termios and poll
# through rustix. macOS port enumeration: IOKit through io-kit-sys and core-foundation.
# Windows also lists the paired Bluetooth devices and serial ports from the registry (the C# used WMI).
[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys.workspace = true
core-foundation.workspace = true

[dev-dependencies]
olv-oracle = { path = "../olv-oracle" }
olv-store = { path = "../olv-store" }
serde.workspace = true

[lints]
workspace = true
