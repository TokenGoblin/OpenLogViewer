[package]
name = "olv-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
olv-core = { path = "../olv-core" }
olv-protocol = { path = "../olv-protocol" }
nusb.workspace = true
serialport.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
time.workspace = true

# Bluetooth LE through the operating system's own API, each behind the same internal trait
# (`ble_ecu_transport::BleBackend`): WinRT on Windows, CoreBluetooth on macOS, and on Linux BlueZ
# over D-Bus with the pure-Rust zbus. No third-party C library is linked on any of them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-bluetooth.workspace = true
dispatch2.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

# Windows: WinRT for Bluetooth LE (`windows`), and the registry (`winreg`) for the paired devices
# and serial ports (the C# used WMI).
[target.'cfg(windows)'.dependencies]
windows.workspace = true
winreg.workspace = true

[dev-dependencies]
olv-oracle = { path = "../olv-oracle" }
olv-store = { path = "../olv-store" }
serde.workspace = true

[lints]
workspace = true
