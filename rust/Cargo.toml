[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
roxmltree = "0.20"
ttf-parser = "0.25"
ab_glyph = "0.2"
png = "0.18"
nusb = "0.2"
time = { version = "0.3", features = ["formatting", "parsing"] }
miniz_oxide = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
