[workspace]
resolver = "3"
members = ["xtask", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
roxmltree = "0.20"
ttf-parser = "0.25"
ab_glyph = "0.2"
png = "0.18"
nusb = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "termios", "event", "fs", "pty"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Devices_Communication", "Win32_Devices_DeviceAndDriverInstallation"] }
io-kit-sys = "0.5"
core-foundation = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
uuid = "1"
btleplug = "0.13"
zbus = "5"
winreg = "0.55"
time = { version = "0.3", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
