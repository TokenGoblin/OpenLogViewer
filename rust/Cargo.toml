[workspace]
resolver = "3"
members = ["xtask", "crates/*", "apps/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
roxmltree = "0.20"
ttf-parser = "0.25"
ab_glyph = "0.2"
png = "0.18"
nusb = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "termios", "event", "fs", "pty"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Devices_Communication", "Win32_Devices_DeviceAndDriverInstallation"] }
io-kit-sys = "0.5"
core-foundation = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
uuid = "1"
# Bluetooth LE, reached through each OS's own API (no third-party C library): WinRT on
# Windows, CoreBluetooth on macOS. Linux speaks to BlueZ over D-Bus with zbus.
windows = { version = "0.62", default-features = false, features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_WinRT",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSObject",
  "NSString",
  "NSUUID",
  "NSValue",
] }
objc2-core-bluetooth = "0.3"
dispatch2 = "0.3"
zbus = "5"
winreg = "0.55"
# Loads FTDI's ftd2xx.dll at run time on Windows (ISC). Never a -sys crate that links it.
libloading = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
miniz_oxide = "0.9"
# The local agent API: an HTTP/1.1 head parser and the WebSocket framing (both MIT/Apache-2.0,
# pure Rust, no TLS: this server only ever listens on the loopback address).
httparse = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
getrandom = "0.4"
# SHA-256 for tuning-project tune fingerprints (MIT/Apache-2.0); must match the C# digest.
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
