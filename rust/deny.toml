# `cargo deny check`: licences, advisories, duplicate and unknown sources.
#
# The licence list is the project's promise in THIRD-PARTY-NOTICES.md, made
# checkable: permissive licences only, no copyleft in anything that ships.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported but do not fail the build; a known
# vulnerability does.
unmaintained = "workspace"
ignore = [
  # ttf-parser is unmaintained but still correct for reading fonts. It comes in through
  # ab_glyph (egui's glyph rasterizer, also used by olv-fontgen) and is a test-only parser
  # of our own generated font; no untrusted input reaches it. Revisit if ab_glyph moves on.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, not a vulnerability; pulled in by ab_glyph" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The fonts egui ships (Ubuntu Light, Hack, Noto Emoji, emoji-icon-font) are under the SIL Open Font
# Licence and the Ubuntu Font Licence. Both let a font be embedded in and redistributed with a program,
# which is all this does with them: they are data in the binary, no code of ours is derived from them
# and nothing links against them. Scoped to this one crate so no other dependency can use it.
exceptions = [
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
# Pure Rust means no third-party C library (PLAN.md). These are the crates that
# would link one; a dependency that pulls any of them in fails the build here.
# The OS's own interfaces (windows-sys, IOKit, CoreFoundation) are not on this list.
deny = [
  { name = "libdbus-sys", reason = "links libdbus; talk to BlueZ with zbus instead" },
  { name = "libudev-sys", reason = "links libudev; port enumeration reads sysfs directly instead" },
  { name = "libusb1-sys", reason = "links libusb; use nusb" },
  { name = "libftd2xx-ffi", reason = "links FTDI's ftd2xx; drive the chip over nusb or its VCP" },
  { name = "openssl-sys", reason = "links OpenSSL; use rustls" },
  { name = "libz-sys", reason = "links zlib; use miniz_oxide" },
]
wildcards = "deny"
# Crates inside this workspace refer to each other by path, which is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
